databases:
  - name: reachinbox-db
    plan: free
    databaseName: reachinbox_db
    user: reachinbox

services:
  # ReachInbox Backend API Web Service
  - type: web
    name: reachinbox-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install --include=dev && DATABASE_URL="postgresql://postgres:postgres@localhost:5432/db" npx prisma generate && npm run build
    startCommand: npx prisma db push --accept-data-loss && node dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: reachinbox-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: SMTP_PROVIDER
        value: smtp
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        value: sumithreddy509@gmail.com
      - key: SMTP_PASS
        value: wgbfpilfbwultpsy
      - key: SMTP_FROM
        value: "Sumith Reddy <sumithreddy509@gmail.com>"
      - key: FRONTEND_URL
        fromService:
          type: web
          name: reachinbox-frontend
          property: host

  # ReachInbox Frontend Static Site
  - type: web
    name: reachinbox-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: reachinbox-backend
          property: host
